name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        working-directory: CFScanner.swiftpm
        run: |
          xcodebuild build \
            -scheme CFScanner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Embed app icon (light + dark)
        run: |
          APP=$(find "$GITHUB_WORKSPACE/build/DD/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          echo "App: $APP"
          ICONSET=/tmp/AppIcon.xcassets/AppIcon.appiconset
          mkdir -p "$ICONSET"
          cp AppIcon/icon-light.png "$ICONSET/icon-light.png"
          cp AppIcon/icon-dark.png "$ICONSET/icon-dark.png"
          cat > "$ICONSET/Contents.json" <<'EOF'
          {
            "images": [
              { "filename": "icon-light.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" },
              { "filename": "icon-dark.png", "idiom": "universal", "platform": "ios", "size": "1024x1024",
                "appearances": [{ "appearance": "luminosity", "value": "dark" }] }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
          xcrun actool /tmp/AppIcon.xcassets --compile "$APP" --platform iphoneos --target-device iphone --target-device ipad --minimum-deployment-target 16.0 --app-icon AppIcon --output-partial-info-plist /tmp/icon-partial.plist
          test -f "$APP/Assets.car"
          ls -lh "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Merge /tmp/icon-partial.plist" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Info.plist"

      - name: Package unsigned IPA
        run: |
          APP=$(find "$GITHUB_WORKSPACE/build/DD/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          echo "Built app: $APP"
          test -n "$APP"
          file "$APP/CFScanner"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CFScanner-unsigned.ipa Payload
          ls -lh CFScanner-unsigned.ipa
          unzip -l CFScanner-unsigned.ipa | head -40
          echo "SHA256: $(shasum -a 256 CFScanner-unsigned.ipa | awk '{print $1}')" | tee ipa-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFScanner-unsigned-ipa
          path: CFScanner-unsigned.ipa

      - name: Publish release with IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ipa-build-${{ github.run_number }}"
          SHA=$(shasum -a 256 CFScanner-unsigned.ipa | awk '{print $1}')
          gh release create "$TAG" CFScanner-unsigned.ipa \
            --title "CFScanner 未签名 IPA（构建 ${{ github.run_number }}）" \
            --notes "云端编译的未签名 IPA，用自己的证书签名后安装。SHA256: $SHA"
